name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build prerequisites
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/release-version.py >> "$GITHUB_OUTPUT"
      - name: Build DEX helper and lint
        run: |
          ./build-helper.sh -Pnl2shJadxVersionName=${{ steps.version.outputs.version }} -Pnl2shJadxVersionCode=${{ steps.version.outputs.code }}
          ./gradlew --no-daemon :app:lintRelease -Pnl2shJadxVersionName=${{ steps.version.outputs.version }} -Pnl2shJadxVersionCode=${{ steps.version.outputs.code }}
          (cd dist && sha256sum -c jadx-helper.jar.sha256)
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          tar -czf dist/third-party-licenses.tar.gz licenses
      - uses: actions/upload-artifact@v4
        with:
          name: jadx-helper-release
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jadx-helper-release
          path: dist
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
